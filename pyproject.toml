[project]
name = "fava-docker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beancount==3.2.3",
    "fava==1.30.16",
    "beanquery==0.2.0",
    "beangulp==0.2.0",
    "beanprice==2.1.0",
    "beancount-reds-plugins==0.4.0",
    "fava-plugins==1.2",
    "python-dateutil==2.9.0.post0",
    "beancount-periodic==0.2.1",
    "fava-portfolio-returns==2.7.0",
    "fava-dashboards==2.0.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
